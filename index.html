<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma EST 43</title>
<meta name="theme-color" content="#7a1c1c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.jpeg">
<link rel="apple-touch-icon" href="logo.jpeg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EST 43">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin:0; padding:0; height:100%; background:#fff; overflow:hidden; }
  #app { position:fixed; top:0; left:0; width:100%; height:100%; border:0; }
  #carga { position:fixed; top:0; left:0; right:0; bottom:0; display:flex;
           flex-direction:column; align-items:center; justify-content:center;
           background:#fff; color:#7a1c1c; font-family:system-ui, sans-serif;
           z-index:2; transition:opacity .4s; }
  #carga img { width:150px; height:150px; margin-bottom:18px; }
  #carga p { margin:0; font-size:16px; font-weight:600; }
  .oculto { opacity:0; pointer-events:none; }
</style>
</head>
<body>
  <div id="carga">
    <img src="logo.jpeg" alt="EST 43">
    <p>Cargando Plataforma EST 43...</p>
  </div>
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbwB2NrzhuOt1oPzHeqwJ5nwIQPODagpJomniCHEMfhFH_txSuYb8dp7azLRE7vo5g3N/exec"
    allow="camera; clipboard-write; fullscreen"
    title="Plataforma EST 43"></iframe>
<script>
  function quitarCarga() { document.getElementById('carga').classList.add('oculto'); }
  document.getElementById('app').addEventListener('load', quitarCarga);
  setTimeout(quitarCarga, 8000);
</script>
</body>
</html>
